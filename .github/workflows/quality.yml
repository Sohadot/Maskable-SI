name: Landing Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run page and social-preview checks
        run: node tests/smoke.mjs
      - name: Run illustrative Maskability reference contract checks
        run: node tests/policy.mjs
